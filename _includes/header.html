<header class="site-header">
  <div class="container">
    <nav class="navbar" aria-label="Main">
      <a class="navbar-brand" href="/">
        <span class="brand-mark" aria-hidden="true">AK</span>
        <span class="brand-name">{{ site.title | default: "Ashfaque Khowaja" }}</span>
      </a>

      <div class="navbar-menu" id="navbar-menu">
        <ul class="nav-links">
          {% for item in site.data.navigation.main %}
            {% assign item_slash = item.url | append: "/" %}
            <li>
              <a href="{{ item.url }}" {% if page.url == item.url or page.url == item_slash %}class="active" aria-current="page"{% endif %}>{{ item.name }}</a>
            </li>
          {% endfor %}
        </ul>
      </div>

      <div class="navbar-actions">
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
          <i class="fas fa-moon" aria-hidden="true"></i>
        </button>
        <button class="hamburger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="navbar-menu">
          <span class="hamburger-box">
            <span class="hamburger-inner"></span>
          </span>
        </button>
      </div>
    </nav>
  </div>
</header>
